<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prep 2026</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Inter, Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }
    .card {
      background: #fff;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(17, 24, 39, 0.1);
      max-width: 420px;
      text-align: center;
    }
    h1 { font-size: 24px; margin: 0 0 10px; }
    p { line-height: 1.6; color: #4b5563; margin: 0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Access protected</h1>
    <p>The site will ask for a PIN before opening the study content.</p>
  </div>

  <script src="Prep2026/pin-protect.js"></script>
  <script>
    document.addEventListener('prep-pin-unlocked', function () {
      window.location.href = 'Prep2026/master_index.html';
    });
  </script>
</body>
</html>
